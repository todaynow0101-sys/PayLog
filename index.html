<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayLog</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0; --surface: #fff; --border: #e0ddd8; --border2: #ccc9c2;
    --text: #1a1a18; --text2: #6b6860; --text3: #9b9890;
    --accent-bg: #1a1a18; --accent-text: #f5f4f0;
    --danger: #c0392b; --warn: #d97706; --success: #27ae60;
    --holiday: #c0392b; --sat: #2471a3;
    --radius: 4px;
  }
  *, body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

  /* AUTH */
  #auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-box { background: var(--surface); border: 1px solid var(--border); width: 100%; max-width: 360px; padding: 40px 32px; }
  .auth-logo { font-size: 22px; font-weight: 800; margin-bottom: 32px; letter-spacing: -0.5px; }
  .auth-logo span { color: var(--text3); font-weight: 400; }
  .auth-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .auth-tab { flex: 1; padding: 8px; text-align: center; font-size: 13px; font-weight: 500; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
  .auth-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 700; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 5px; letter-spacing: 0.5px; text-transform: uppercase; }
  .field input, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); background: var(--bg); font-family: inherit; font-size: 14px; color: var(--text); outline: none; border-radius: var(--radius); transition: border-color 0.15s; }
  .field input:focus { border-color: var(--text); background: #fff; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; font-family: inherit; font-size: 13px; font-weight: 700; border: 1px solid transparent; border-radius: var(--radius); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .btn-primary { background: var(--accent-bg); color: var(--accent-text); }
  .btn-primary:hover { opacity: 0.85; }
  .btn-ghost { background: transparent; color: var(--text2); border-color: var(--border); }
  .btn-ghost:hover { border-color: var(--text); color: var(--text); }
  .btn-danger { background: transparent; color: var(--danger); border-color: #f0c0bc; }
  .btn-danger:hover { background: #fff0ee; }
  .btn-full { width: 100%; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .err-msg { font-size: 12px; color: var(--danger); margin-top: 10px; }

  /* APP */
  #app-screen { display: none; min-height: 100vh; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 52px; position: sticky; top: 0; z-index: 100; }
  .header-logo { font-size: 16px; font-weight: 800; letter-spacing: -0.5px; }
  .header-logo span { color: var(--text3); font-weight: 400; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .user-badge { font-size: 12px; color: var(--text2); }
  nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; }
  .nav-tab { display: flex; align-items: center; gap: 7px; padding: 11px 16px; font-size: 13px; font-weight: 500; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
  .nav-tab svg { opacity: 0.45; }
  .nav-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 700; }
  .nav-tab.active svg { opacity: 1; }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .section-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
  .section-title { font-size: 15px; font-weight: 700; }
  .section-sub { font-size: 12px; color: var(--text3); margin-top: 3px; }

  /* DATA TABLE */
  .data-table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); }
  .data-table th { padding: 9px 12px; font-size: 11px; font-weight: 700; color: var(--text2); text-align: left; background: var(--bg); border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.3px; }
  .data-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: #faf9f7; }

  /* CALENDAR */
  .cal-wrap { background: var(--surface); border: 1px solid var(--border); overflow-x: auto; }
  .cal-table { width: 100%; border-collapse: collapse; min-width: 800px; }
  .cal-table th { padding: 7px 4px; font-size: 11px; font-weight: 700; text-align: center; background: var(--bg); border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); white-space: nowrap; }
  .cal-table th:last-child { border-right: none; }
  .cal-table td { padding: 4px 3px; text-align: center; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); vertical-align: middle; }
  .cal-table td:last-child { border-right: none; }
  .cal-table tr:last-child td { border-bottom: none; }
  .emp-cell { text-align: left !important; padding: 8px 12px !important; min-width: 110px; position: sticky; left: 0; background: var(--surface); z-index: 2; border-right: 2px solid var(--border) !important; }
  .emp-cell-bg { background: var(--bg) !important; }
  .emp-name { font-weight: 700; font-size: 13px; }
  .emp-meta { font-size: 10px; color: var(--text3); margin-top: 1px; }
  .day-header { min-width: 46px; }
  .day-num { font-size: 12px; font-weight: 700; }
  .day-label { font-size: 10px; font-weight: 500; margin-top: 1px; }
  .col-sat .day-num, .col-sat .day-label { color: var(--sat); }
  .col-holiday .day-num, .col-holiday .day-label { color: var(--holiday); }
  .cell-sat { background: #f0f5fb; }
  .cell-red { background: #fdf0f0; }
  .hour-input { width: 40px; height: 28px; border: 1px solid transparent; background: transparent; font-size: 12px; text-align: center; color: var(--text); cursor: pointer; border-radius: 3px; outline: none; transition: all 0.1s; padding: 0; font-family: inherit; }
  .hour-input:focus { border-color: var(--text); background: #fff; }
  .hour-input.has-val { background: #eef7ee; font-weight: 700; }
  .total-cell { background: var(--bg) !important; font-size: 11px; min-width: 80px; padding: 4px 8px !important; }
  .total-hours { font-weight: 700; font-size: 12px; }
  .total-over { color: var(--warn); }
  .total-pay { font-size: 10px; color: var(--text3); margin-top: 1px; }
  .total-juhyu { font-size: 9px; color: var(--warn); }
  .total-net { font-size: 10px; color: var(--success); margin-top: 2px; font-weight: 700; }

  /* MONTH NAV */
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-nav select { padding: 7px 10px; border: 1px solid var(--border); background: var(--surface); font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text); border-radius: var(--radius); cursor: pointer; outline: none; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 200; align-items: center; justify-content: center; padding: 24px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); width: 100%; max-width: 420px; padding: 28px; border-radius: var(--radius); max-height: 92vh; overflow-y: auto; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
  .pay-type-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
  .pay-type-btn { flex: 1; padding: 9px; text-align: center; font-size: 13px; font-weight: 700; color: var(--text3); cursor: pointer; background: var(--bg); border: none; font-family: inherit; transition: all 0.15s; }
  .pay-type-btn.active { background: var(--text); color: #fff; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; }
  .toggle-label { font-size: 13px; font-weight: 600; }
  .toggle-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .toggle-switch { position: relative; width: 40px; height: 22px; cursor: pointer; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; background: var(--border2); border-radius: 22px; transition: 0.2s; }
  .toggle-slider:before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.2s; }
  .toggle-switch input:checked + .toggle-slider { background: var(--text); }
  .toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); }

  /* SUMMARY */
  .summary-card { background: var(--surface); border: 1px solid var(--border); margin-bottom: 12px; }
  .emp-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .emp-row:last-child { border-bottom: none; }
  .total-bar { background: var(--text); color: var(--accent-text); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-radius: var(--radius); }
  .total-bar .label { font-size: 13px; font-weight: 500; }
  .total-bar .amount { font-size: 20px; font-weight: 800; }
  .deduct-line { display: flex; justify-content: space-between; font-size: 12px; color: var(--text3); margin-top: 3px; }
  .net-line { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--success); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }

  /* EXPORT */
  #export-sheet { position: fixed; left: -9999px; top: 0; width: 580px; background: #fff; padding: 44px; font-family: 'Pretendard', sans-serif; color: #1a1a18; }
  .export-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .export-sub { font-size: 12px; color: #999; margin-bottom: 32px; }
  .export-emp-block { padding: 16px 0; border-bottom: 1px solid #efefef; }
  .export-emp-block:last-child { border-bottom: none; }
  .export-emp-name { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  .export-emp-rn { font-size: 12px; color: #888; margin-bottom: 10px; }
  .export-pay-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px; }
  .export-pay-row.total { font-weight: 700; font-size: 14px; border-top: 1px solid #eee; padding-top: 6px; margin-top: 4px; }
  .export-pay-row.net { font-weight: 800; font-size: 15px; color: #27ae60; }
  .export-footer { margin-top: 28px; padding-top: 16px; border-top: 1px solid #efefef; font-size: 11px; color: #bbb; display: flex; justify-content: space-between; }

  .badge { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 11px; font-weight: 700; }
  .badge-hourly { background: #e8f4fd; color: #2471a3; }
  .badge-monthly { background: #eafaf1; color: #1e8449; }
  .badge-33 { background: #fff3e0; color: #d97706; }

  .empty { text-align: center; padding: 52px 0; color: var(--text3); }
  .empty svg { opacity: 0.2; margin-bottom: 12px; }
  .empty-text { font-size: 13px; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--text); color: #fff; padding: 10px 20px; border-radius: 100px; font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.22s; z-index: 999; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .flex { display: flex; } .gap8 { gap: 8px; } .mt16 { margin-top: 16px; }
  .rn-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .rn-input { flex: 1; padding: 10px 12px; border: 1px solid var(--border); background: var(--bg); font-size: 14px; color: var(--text); outline: none; border-radius: var(--radius); transition: border-color 0.15s; width: 100%; font-family: monospace; }
  .rn-input:focus { border-color: var(--text); background: #fff; }
  .rn-sep { color: var(--text3); font-weight: 700; flex-shrink: 0; }
  .field-label { font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }

  /* MOBILE */
  .mobile-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .mobile-card-header { padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .mobile-card-name { font-weight: 700; font-size: 15px; }
  .mobile-card-meta { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .mobile-card-total { text-align: right; }
  .mobile-card-total-hours { font-size: 13px; font-weight: 700; }
  .mobile-card-total-pay { font-size: 12px; color: var(--text3); }
  .mobile-card-total-net { font-size: 12px; font-weight: 700; color: var(--success); }
  .mobile-days { display: grid; grid-template-columns: repeat(7, 1fr); }
  .mobile-day { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 5px 2px; text-align: center; }
  .mobile-day:nth-child(7n) { border-right: none; }
  .mobile-day-num { font-size: 10px; font-weight: 700; margin-bottom: 2px; }
  .mobile-day-name { font-size: 9px; color: var(--text3); margin-bottom: 3px; }
  .mobile-day.is-sat .mobile-day-num, .mobile-day.is-sat .mobile-day-name { color: var(--sat); }
  .mobile-day.is-red .mobile-day-num, .mobile-day.is-red .mobile-day-name { color: var(--holiday); }
  .mobile-day.is-sat { background: #f0f5fb; }
  .mobile-day.is-red { background: #fdf0f0; }
  .mobile-day.is-empty { background: var(--bg); opacity: 0.3; pointer-events: none; }
  .mobile-hour-btn { width: 100%; min-height: 32px; border: 1px solid var(--border); background: transparent; border-radius: 3px; font-size: 12px; font-weight: 600; color: var(--text3); cursor: pointer; font-family: inherit; padding: 2px; }
  .mobile-hour-btn.has-val { background: #eef7ee; color: var(--text); border-color: #b8ddb8; }
  .mobile-input-popup { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 2px solid var(--border); padding: 16px 20px 32px; z-index: 300; box-shadow: 0 -4px 24px rgba(0,0,0,0.12); }
  .mobile-input-popup.open { display: block; }
  .mobile-input-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
  .mobile-quick-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .mobile-quick-btn { padding: 10px 0; border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius); font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; flex: 1; min-width: 44px; text-align: center; }
  .mobile-quick-btn:active { background: var(--text); color: #fff; border-color: var(--text); }
  .mobile-input-row { display: flex; gap: 8px; }
  .mobile-custom-input { flex: 1; padding: 11px 14px; border: 1px solid var(--border); background: #fff; font-size: 18px; text-align: center; border-radius: var(--radius); outline: none; font-family: monospace; }
  .mobile-custom-input:focus { border-color: var(--text); }
  .mobile-overlay { display: none; position: fixed; inset: 0; z-index: 299; background: rgba(0,0,0,0.2); }
  .mobile-overlay.open { display: block; }

  @media (max-width: 768px) {
    main { padding: 12px 16px; }
    .section-header { flex-wrap: wrap; gap: 10px; }
    .month-nav select { font-size: 13px; }
    header { padding: 0 16px; height: 48px; }
    nav { padding: 0 4px; }
    .nav-tab { padding: 10px 8px; font-size: 12px; gap: 4px; }
    .cal-wrap { display: none; }
    #mobile-sched { display: block; }
    .header-right .user-badge { display: none; }
    .section-header > div:last-child { width: 100%; justify-content: space-between; }
  }
  @media (min-width: 769px) {
    #mobile-sched { display: none; }
    .mobile-input-popup, .mobile-overlay { display: none !important; }
  }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">Pay<span>Log</span></div>
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchTab('login')">로그인</div>
      <div class="auth-tab" onclick="switchTab('signup')">회원가입</div>
    </div>
    <div id="login-form">
      <div class="field"><label>아이디</label><input id="login-id" type="text" placeholder="아이디" autocomplete="username"></div>
      <div class="field"><label>비밀번호</label><input id="login-pw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div class="err-msg" id="login-err"></div>
      <button class="btn btn-primary btn-full mt16" onclick="doLogin()" id="login-btn">로그인</button>
    </div>
    <div id="signup-form" style="display:none">
      <div class="field"><label>아이디</label><input id="signup-id" type="text" placeholder="영문, 숫자 조합"></div>
      <div class="field"><label>비밀번호</label><input id="signup-pw" type="password" placeholder="6자 이상"></div>
      <div class="field"><label>비밀번호 확인</label><input id="signup-pw2" type="password" onkeydown="if(event.key==='Enter')doSignup()"></div>
      <div class="err-msg" id="signup-err"></div>
      <button class="btn btn-primary btn-full mt16" onclick="doSignup()" id="signup-btn">가입하기</button>
    </div>
  </div>
</div>

<div id="app-screen">
  <header>
    <div class="header-logo">Pay<span>Log</span></div>
    <div class="header-right">
      <span class="user-badge" id="user-badge"></span>
      <button class="btn btn-ghost" onclick="doLogout()" style="font-size:12px;padding:6px 12px;">로그아웃</button>
    </div>
  </header>
  <nav>
    <div class="nav-tab active" onclick="showTab('schedule')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>스케줄
    </div>
    <div class="nav-tab" onclick="showTab('employees')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>직원
    </div>
    <div class="nav-tab" onclick="showTab('summary')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>급여 내보내기
    </div>
  </nav>
  <main>
    <!-- 스케줄 -->
    <div id="tab-schedule">
      <div class="section-header">
        <div>
          <div class="section-title">근무 스케줄</div>
          <div class="section-sub">날짜를 탭해서 근무시간 입력 · 빨간 날짜는 공휴일</div>
        </div>
        <div class="flex gap8" style="align-items:center;flex-wrap:wrap;">
          <div class="month-nav">
            <select id="year-select" onchange="onMonthChange()"></select>
            <select id="month-select" onchange="onMonthChange()"></select>
          </div>
          <button class="btn btn-ghost" onclick="copyPrevMonth()" style="font-size:12px;padding:7px 12px;">지난달 복사</button>
        </div>
      </div>
      <div class="cal-wrap"><div id="sched-container"></div></div>
      <div id="mobile-sched"></div>
      <div class="mobile-overlay" id="mobile-overlay" onclick="closeMobileInput()"></div>
      <div class="mobile-input-popup" id="mobile-input-popup">
        <div class="mobile-input-title" id="mobile-input-title"></div>
        <div class="mobile-quick-row" id="mobile-quick-btns"></div>
        <div class="mobile-input-row">
          <input type="number" class="mobile-custom-input" id="mobile-custom-input" placeholder="직접입력" min="0" max="24" step="0.5"
            onkeydown="if(event.key==='Enter'||event.key==='Done')confirmMobileInput()">
          <button class="btn btn-primary" onclick="confirmMobileInput()" style="padding:11px 20px;font-size:15px;">확인</button>
          <button class="btn btn-ghost" onclick="deleteMobileInput()">삭제</button>
        </div>
      </div>
    </div>

    <!-- 직원 -->
    <div id="tab-employees" style="display:none">

}

function getDaysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function getDow(y,m,d){ return new Date(y,m-1,d).getDay(); }

function calcMonthPay(emp, data, year, month) {
  if(emp.pay_type==='monthly') {
    const gross=emp.monthly_salary||0;
    return emp.tax33 ? calc33(gross) : { gross, withholding:0, net:gross };
  }
  const totalDays=getDaysInMonth(year,month);
  const firstDow=new Date(year,month-1,1).getDay();
  const weekMap={};
  let totalH=0;
  for(let d=1;d<=totalDays;d++){
    const h=parseFloat(data[emp.id]?.[d]||0);
    const wk=Math.ceil((d+firstDow-1)/7);
    if(!weekMap[wk])weekMap[wk]=0;
    weekMap[wk]+=h; totalH+=h;
  }
  let gross=0;
  Object.values(weekMap).forEach(wh=>{
    gross+=wh*emp.hourly_wage;
    if(wh>=15&&emp.juhyu_auto!==false) gross+=(wh/5)*emp.hourly_wage;
  });
  gross=Math.round(gross);
  return emp.tax33 ? calc33(gross) : { gross, withholding:0, net:gross };
}

function renderCalendar(year,month) {
  const container=document.getElementById('sched-container');
  if(!employees.length){ container.innerHTML=`<div class="empty"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><div class="empty-text">직원을 먼저 추가해주세요</div></div>`; return; }
  const totalDays=getDaysInMonth(year,month);
  const hols=getHolidays(year);
  const days=[];
  for(let d=1;d<=totalDays;d++){
    const dow=getDow(year,month,d);
    const isRed=hols.has(`${month}-${d}`)||dow===0;
    const isSat=dow===6;
    days.push({d,dow,isRed,isSat});
  }
  let html=`<table class="cal-table"><thead><tr>
    <th class="emp-cell emp-cell-bg">직원</th>
    ${days.map(({d,dow,isRed,isSat})=>{
      const cls=isRed?'col-holiday':isSat?'col-sat':'';
      return `<th class="day-header ${cls}"><div class="day-num">${d}</div><div class="day-label">${DAY_NAMES[dow]}</div></th>`;
    }).join('')}
    <th style="min-width:90px;background:var(--bg);">월합계</th>
  </tr></thead><tbody>`;

  employees.forEach(emp=>{
    const isM=emp.pay_type==='monthly';
    const {gross,withholding,net}=calcMonthPay(emp,scheduleData,year,month);
    const firstDow=new Date(year,month-1,1).getDay();
    const weekMap={};
    let monthHours=0;
    days.forEach(({d})=>{
      const h=parseFloat(scheduleData[emp.id]?.[d]||0);
      const wk=Math.ceil((d+firstDow-1)/7);
      if(!weekMap[wk])weekMap[wk]=0;
      weekMap[wk]+=h; monthHours+=h;
    });
    const isOver=!isM&&Object.values(weekMap).some(wh=>wh>=15)&&emp.juhyu_auto!==false;
    const juhyu=!isM?Object.values(weekMap).reduce((s,wh)=>s+(wh>=15&&emp.juhyu_auto!==false?(wh/5)*emp.hourly_wage:0),0):0;

    if(isM){
      html+=`<tr>
        <td class="emp-cell"><div class="emp-name">${emp.name}</div><div class="emp-meta"><span class="badge badge-monthly">월급제</span></div></td>
        ${days.map(({isRed,isSat})=>`<td class="${isRed?'cell-red':isSat?'cell-sat':''}" style="color:var(--text3);font-size:10px;">—</td>`).join('')}
        <td class="total-cell">
          <div class="total-hours">고정월급</div>
          <div class="total-pay">${gross.toLocaleString()}원</div>
          ${emp.tax33?`<div class="total-net">실수령 ${net.toLocaleString()}원</div>`:''}
        </td>
      </tr>`; return;
    }

    html+=`<tr>
      <td class="emp-cell"><div class="emp-name">${emp.name}</div><div class="emp-meta">${Number(emp.hourly_wage).toLocaleString()}원/h</div></td>
      ${days.map(({d,isRed,isSat})=>{
        const val=scheduleData[emp.id]?.[d]||'';
        const cls=isRed?'cell-red':isSat?'cell-sat':'';
        return `<td class="${cls}"><input type="number" class="hour-input${val?' has-val':''}" value="${val}" min="0" max="24" step="0.5" data-empid="${emp.id}" data-day="${d}" onchange="updateHour('${emp.id}',${d},this.value,this)" onkeydown="handleArrow(event,this)" onfocus="this.select()"></td>`;
      }).join('')}
      <td class="total-cell">
        <div class="total-hours ${isOver?'total-over':''}">${monthHours}h</div>
        <div class="total-pay">${gross.toLocaleString()}원</div>
        ${isOver?`<div class="total-juhyu">주휴 +${Math.round(juhyu).toLocaleString()}</div>`:''}
        ${emp.tax33?`<div class="total-net">실수령 ${net.toLocaleString()}원</div>`:''}
      </td>
    </tr>`;
  });
  html+='</tbody></table>';
  container.innerHTML=html;
}

async function updateHour(empId,dayOfMonth,val,inputEl) {
  const {year,month}=getYM('');
  const hours=parseFloat(val)||0;
  if(inputEl) inputEl.classList.toggle('has-val',hours>0);
  if(!scheduleData[empId])scheduleData[empId]={};
  scheduleData[empId][dayOfMonth]=hours;
  await sb.from('schedules').upsert({employee_id:empId,year,month,day_of_month:dayOfMonth,hours},{onConflict:'employee_id,year,month,day_of_month'});
  if(window.innerWidth<=768) renderMobile(year,month);
  else renderCalendar(year,month);
}

function handleArrow(e,input) {
  const day=parseInt(input.dataset.day), empId=input.dataset.empid;
  const {year,month}=getYM('');
  const totalDays=getDaysInMonth(year,month);
  let targetDay=null;
  if((e.key==='ArrowRight'||e.key==='Tab')&&!e.shiftKey){ e.preventDefault(); targetDay=day<totalDays?day+1:null; }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); targetDay=day>1?day-1:null; }
  else if(e.key==='Enter'){ e.preventDefault(); targetDay=day<totalDays?day+1:null; }
  if(targetDay){ const next=document.querySelector(`.hour-input[data-empid="${empId}"][data-day="${targetDay}"]`); if(next){next.focus();next.select();} }
}

// ── 모바일 뷰 ──
function renderMobile(year,month) {
  const container=document.getElementById('mobile-sched');
  if(!employees.length){ container.innerHTML=`<div class="empty"><div class="empty-text">직원을 먼저 추가해주세요</div></div>`; return; }
  const totalDays=getDaysInMonth(year,month);
  const hols=getHolidays(year);
  const firstDow=new Date(year,month-1,1).getDay();
  let html='';
  employees.forEach(emp=>{
    const isM=emp.pay_type==='monthly';
    const {gross,withholding,net}=calcMonthPay(emp,scheduleData,year,month);
    const weekMap={};
    let monthHours=0;
    if(!isM){ for(let d=1;d<=totalDays;d++){ const h=parseFloat(scheduleData[emp.id]?.[d]||0); const wk=Math.ceil((d+firstDow-1)/7); if(!weekMap[wk])weekMap[wk]=0; weekMap[wk]+=h; monthHours+=h; } }
    const isOver=!isM&&Object.values(weekMap).some(wh=>wh>=15)&&emp.juhyu_auto!==false;
    const juhyu=!isM?Object.values(weekMap).reduce((s,wh)=>s+(wh>=15&&emp.juhyu_auto!==false?(wh/5)*emp.hourly_wage:0),0):0;

    html+=`<div class="mobile-card" id="card-${emp.id}">
      <div class="mobile-card-header">
        <div>
          <div class="mobile-card-name">${emp.name}</div>
          <div class="mobile-card-meta">${isM?'월급제 · '+gross.toLocaleString()+'원':Number(emp.hourly_wage).toLocaleString()+'원/h'}</div>
        </div>
        <div class="mobile-card-total">
          <div class="mobile-card-total-hours${isOver?' total-over':''}">${isM?'고정':monthHours+'h'}${isOver?' ⚠':''}</div>
          <div class="mobile-card-total-pay">세전 ${gross.toLocaleString()}원${isOver?` (주휴+${Math.round(juhyu).toLocaleString()})`:''}</div>
          ${emp.tax33?`<div class="mobile-card-total-net">실수령 ${net.toLocaleString()}원</div>`:''}
        </div>
      </div>`;
    if(!isM){
      let dayHtml='';
      for(let blank=0;blank<firstDow;blank++) dayHtml+=`<div class="mobile-day is-empty"></div>`;
      for(let d=1;d<=totalDays;d++){
        const dow=getDow(year,month,d);
        const isRed=hols.has(`${month}-${d}`)||dow===0, isSat=dow===6;
        const val=scheduleData[emp.id]?.[d]||'';
        dayHtml+=`<div class="mobile-day ${isRed?'is-red':isSat?'is-sat':''}">
          <div class="mobile-day-num">${d}</div>
          <div class="mobile-day-name">${DAY_NAMES[dow]}</div>
          <button class="mobile-hour-btn${val?' has-val':''}" onclick="openMobileInput('${emp.id}',${d},'${emp.name}',${year},${month})">${val||'—'}</button>
        </div>`;
      }
      html+=`<div class="mobile-days">${dayHtml}</div>`;
    }
    html+='</div>';
  });
  container.innerHTML=html;
}

function openMobileInput(empId,day,empName,year,month) {
  mobileEditState={empId,day,year,month,empName};
  const val=scheduleData[empId]?.[day]||'';
  const dow=DAY_NAMES[getDow(year,month,day)];
  document.getElementById('mobile-input-title').textContent=`${empName} · ${month}/${day}(${dow})`;
  const quickVals=[3,4,5,6,7,8,9,10];
  document.getElementById('mobile-quick-btns').innerHTML=quickVals.map(v=>`<button class="mobile-quick-btn" onclick="setMobileQuick(${v})">${v}h</button>`).join('');
  const ci=document.getElementById('mobile-custom-input'); ci.value=val;
  document.getElementById('mobile-input-popup').classList.add('open');
  document.getElementById('mobile-overlay').classList.add('open');
  // 스크롤 위치 저장
  mobileEditState.scrollY=window.scrollY;
  setTimeout(()=>{ ci.focus(); ci.select(); },80);
}

async function setMobileQuick(v) {
  if(!mobileEditState) return;
  const {empId,day}=mobileEditState;
  await updateHour(empId,day,v,null);
  restoreScroll(); closeMobileInput();
}
async function confirmMobileInput() {
  if(!mobileEditState) return;
  const {empId,day}=mobileEditState;
  const val=document.getElementById('mobile-custom-input').value;
  await updateHour(empId,day,val,null);
  restoreScroll(); closeMobileInput();
}
async function deleteMobileInput() {
  if(!mobileEditState) return;
  const {empId,day}=mobileEditState;
  await updateHour(empId,day,0,null);
  restoreScroll(); closeMobileInput();
}
function restoreScroll() {
  if(mobileEditState?.empId) {
    setTimeout(()=>{ const card=document.getElementById(`card-${mobileEditState.empId}`); if(card) card.scrollIntoView({block:'nearest',behavior:'instant'}); },50);
  }
}
function closeMobileInput() {
  document.getElementById('mobile-input-popup').classList.remove('open');
  document.getElementById('mobile-overlay').classList.remove('open');
  mobileEditState=null;
}

// ── SUMMARY ──
function renderSummary() {
  const year=parseInt(document.getElementById('sum-year-select').value);
  const month=parseInt(document.getElementById('sum-month-select').value);
  syncSummary(year,month);
}

async function syncSummary(year,month) {
  if(!employees.length){ document.getElementById('summary-container').innerHTML=`<div class="empty"><div class="empty-text">직원을 먼저 추가해주세요</div></div>`; return; }
  const empIds=employees.map(e=>e.id);
  const {data}=await sb.from('schedules').select('*').in('employee_id',empIds).eq('year',year).eq('month',month);
  const tmpData={};
  (data||[]).forEach(r=>{ if(!tmpData[r.employee_id])tmpData[r.employee_id]={}; tmpData[r.employee_id][r.day_of_month]=r.hours; });

  let grandGross=0, grandNet=0;
  const rows=employees.map(emp=>{ const pay=calcMonthPay(emp,tmpData,year,month); grandGross+=pay.gross; grandNet+=pay.net; return {emp,pay}; });

  document.getElementById('summary-container').innerHTML=`
    <div class="total-bar">
      <div class="label">${year}년 ${month}월 총 인건비</div>
      <div>
        <div class="amount">${Math.round(grandGross).toLocaleString()}원</div>
        <div style="font-size:12px;opacity:0.7;margin-top:2px;">실지급 ${Math.round(grandNet).toLocaleString()}원</div>
      </div>
    </div>
    <div class="summary-card">
      ${rows.map(({emp,pay})=>{
        const isM=emp.pay_type==='monthly';
        const rnFull=(emp.resident_front&&emp.resident_number)?`${emp.resident_front} — ${emp.resident_number}`:(emp.resident_number?`— ${emp.resident_number}`:'주민번호 미입력');
        return `<div class="emp-row">
          <div style="flex:1;">
            <div style="font-weight:700;font-size:14px;margin-bottom:2px;">${emp.name} <span class="badge ${isM?'badge-monthly':'badge-hourly'}">${isM?'월급제':'시급제'}</span></div>
            <div style="font-size:12px;color:var(--text3);font-family:monospace;margin-bottom:6px;">${rnFull}</div>
            <div class="deduct-line"><span>세전</span><span>${Math.round(pay.gross).toLocaleString()}원</span></div>
            ${emp.tax33?`<div class="deduct-line"><span>원천징수(3.3%)</span><span>-${Math.round(pay.withholding).toLocaleString()}원</span></div>`:''}
            <div class="net-line"><span>실수령액</span><span>${Math.round(pay.net).toLocaleString()}원</span></div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div style="font-size:12px;color:var(--text3);">이미지 저장 버튼을 누르면 세무사 신고용 이미지가 저장됩니다</div>`;

  const now=new Date();
  document.getElementById('export-sheet').innerHTML=`
    <div class="export-title">PayLog 급여 내역</div>
    <div class="export-sub">${year}년 ${month}월 &nbsp;·&nbsp; 출력일 ${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}</div>
    ${rows.map(({emp,pay})=>{
      const rnFull=(emp.resident_front&&emp.resident_number)?`${emp.resident_front} — ${emp.resident_number}`:(emp.resident_number?`— ${emp.resident_number}`:'주민번호 미입력');
      return `<div class="export-emp-block">
        <div class="export-emp-name">${emp.name}</div>
        <div class="export-emp-rn">${rnFull}</div>
        <div class="export-pay-row"><span>세전 급여</span><span>${Math.round(pay.gross).toLocaleString()}원</span></div>
        ${emp.tax33?`<div class="export-pay-row"><span>원천징수 (3.3%)</span><span>- ${Math.round(pay.withholding).toLocaleString()}원</span></div>`:''}
        <div class="export-pay-row net"><span>실수령액</span><span>${Math.round(pay.net).toLocaleString()}원</span></div>
      </div>`;
    }).join('')}
    <div class="export-footer"><span>총 인건비(세전): ${Math.round(grandGross).toLocaleString()}원 &nbsp;/&nbsp; 총 실지급: ${Math.round(grandNet).toLocaleString()}원</span><span>PayLog</span></div>`;
}

async function exportImage() {
  const sheet=document.getElementById('export-sheet');
  sheet.style.left='0'; sheet.style.zIndex='-1';
  await new Promise(r=>setTimeout(r,200));
  const canvas=await html2canvas(sheet,{scale:2,backgroundColor:'#ffffff',useCORS:true});
  sheet.style.left='-9999px';
  const year=document.getElementById('sum-year-select').value;
  const month=document.getElementById('sum-month-select').value;
  const link=document.createElement('a');
  link.download=`paylog_${year}년${month}월_급여내역.png`;
  link.href=canvas.toDataURL('image/png');
  link.click();
  toast('이미지가 저장됐어요');
}

function showTab(name) {
  ['schedule','employees','summary'].forEach(t=>{ document.getElementById(`tab-${t}`).style.display=t===name?'block':'none'; });
  document.querySelectorAll('.nav-tab').forEach((el,i)=>el.classList.toggle('active',['schedule','employees','summary'][i]===name));
  if(name==='summary') renderSummary();
}
function setErr(id,msg){ document.getElementById(id).textContent=msg; }
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2500); }
</script>
